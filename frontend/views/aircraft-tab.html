<div class="aircraft-tab-container animation-fade-in">
    <div class="view-header" style="margin-bottom: 20px;">
        <div class="view-title">
            <i class="fas fa-plane-up"></i>
            <h2 style="margin: 0;">항공기 기종 관리</h2>
        </div>
        <p class="view-description" style="margin: 8px 0 0 0;">ICAO/IATA 기종 정보를 조회하고 기본 성능 데이터를 유지 관리합니다.</p>
    </div>

    <div class="aircraft-grid">
        <!-- 목록 영역 -->
        <section class="card aircraft-list" aria-label="기종 목록">
            <div class="card-header">
                <h3><i class="fas fa-database"></i> 등록 기종</h3>
                <div class="aircraft-header-actions">
                    <div class="input-with-icon">
                        <i class="fas fa-search"></i>
                        <input type="text" id="aircraft-search" placeholder="제조사, 모델, ICAO, IATA 검색">
                    </div>
                    <button id="aircraft-refresh-btn" class="btn btn-secondary btn-sm">
                        <i class="fas fa-rotate"></i> 새로고침
                    </button>
                </div>
            </div>
            <div class="card-body">
                <div id="aircraft-status" class="status-message" role="status"></div>
                <div class="table-responsive">
                    <table class="table table-hover" aria-describedby="aircraft-status">
                        <thead>
                            <tr>
                                <th style="width: 50px; text-align: center;">번호</th>
                                <th>ICAO</th>
                                <th>IATA</th>
                                <th>제조사</th>
                                <th>모델</th>
                                <th>속도 (km/h)</th>
                                <th>속도 (kt)</th>
                                <th>상승 (fpm)</th>
                                <th>천정 (FL)</th>
                                <th style="width: 120px;">관리</th>
                            </tr>
                        </thead>
                        <tbody id="aircraft-table-body">
                            <tr>
                                <td colspan="10" style="text-align: center; color: #888; padding: 30px 0;">데이터를 불러오는 중입니다...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer aircraft-pagination">
                <div class="pagination-info">
                    <span id="aircraft-total-count">0</span>건 중 페이지 <span id="aircraft-page-info">1 / 1</span>
                </div>
                <div class="pagination-controls">
                    <button id="aircraft-prev-btn" class="btn btn-secondary btn-sm" disabled>
                        <i class="fas fa-chevron-left"></i> 이전
                    </button>
                    <label style="display: flex; align-items: center; gap: 8px; white-space: nowrap;">
                        페이지 당
                        <select id="aircraft-page-size">
                            <option value="10">10</option>
                            <option value="20">20</option>
                            <option value="50">50</option>
                            <option value="100" selected>100</option>
                        </select>
                    </label>
                    <button id="aircraft-next-btn" class="btn btn-secondary btn-sm" disabled>
                        다음 <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- 입력/수정 영역 -->
        <section class="card aircraft-form" aria-label="기종 입력">
            <div class="card-header">
                <h3 id="aircraft-form-title"><i class="fas fa-plus-circle"></i> 새 기종 등록</h3>
                <div style="display: flex; gap: 8px;">
                    <button id="aircraft-import-csv-btn" class="btn btn-secondary btn-sm">
                        <i class="fas fa-file-import"></i> CSV 가져오기
                    </button>
                    <button id="aircraft-reset-btn" class="btn btn-light btn-sm">초기화</button>
                </div>
            </div>
            <div class="card-body">
                <form id="aircraft-form">
                    <div class="form-grid">
                        <label>
                            ICAO 코드 (필수)
                            <input type="text" id="aircraft-icao" maxlength="4" placeholder="예: B77L" required>
                        </label>
                        <label>
                            IATA 코드
                            <input type="text" id="aircraft-iata" maxlength="3" placeholder="예: 77W">
                        </label>
                        <label>
                            제조사
                            <input type="text" id="aircraft-manufacturer" placeholder="예: Boeing">
                        </label>
                        <label>
                            모델
                            <input type="text" id="aircraft-model" placeholder="예: 777-200LR">
                        </label>
                        <label>
                            분류/설명
                            <input type="text" id="aircraft-type-description" placeholder="예: Long-range twinjet">
                        </label>
                        <label>
                            순항 속도 (km/h)
                            <input type="number" id="aircraft-speed-kmh" min="0" step="10" placeholder="예: 905">
                        </label>
                        <label>
                            순항 속도 (kt)
                            <input type="number" id="aircraft-speed-knots" min="0" step="5" placeholder="예: 488">
                        </label>
                        <label>
                            상승률 (fpm)
                            <input type="number" id="aircraft-climb" min="0" step="100" placeholder="예: 2000">
                        </label>
                        <label>
                            최고 운용고도 (FL)
                            <input type="number" id="aircraft-ceiling" min="0" step="10" placeholder="예: 430">
                        </label>
                    </div>
                    <label style="display: block; margin-top: 15px;">
                        비고
                        <textarea id="aircraft-notes" rows="3" placeholder="특이사항 또는 참고 메모"></textarea>
                    </label>
                    <div class="form-actions">
                        <button type="submit" id="aircraft-submit-btn" class="btn btn-primary">
                            <i class="fas fa-save"></i> 저장
                        </button>
                        <button type="button" id="aircraft-cancel-edit" class="btn btn-secondary" style="display: none;">
                            <i class="fas fa-undo"></i> 수정 취소
                        </button>
                    </div>
                    <input type="hidden" id="aircraft-current-icao" value="">
                </form>
            </div>
        </section>
    </div>

    <div id="aircraft-loading" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
        <p>데이터 동기화 중...</p>
    </div>

    <!-- CSV Import Modal -->
    <div id="aircraft-import-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-file-import"></i> CSV 파일 가져오기</h3>
                <button type="button" class="modal-close" id="aircraft-import-modal-close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="csv-import-section">
                    <div class="import-file-area">
                        <input type="file" id="aircraft-csv-file" accept=".csv" style="display: none;">
                        <div id="csv-drop-zone" class="csv-drop-zone">
                            <i class="fas fa-cloud-arrow-up"></i>
                            <p>CSV 파일을 여기에 끌어 놓거나 <a href="#" id="csv-file-click">클릭</a>하여 선택하세요</p>
                            <small>지원 형식: CSV (comma-separated values)</small>
                        </div>
                        <div id="csv-file-info" class="csv-file-info" style="display: none; margin-top: 15px;">
                            <div style="display: flex; align-items: center; gap: 10px; padding: 10px; background: #f0f8ff; border-radius: 6px;">
                                <i class="fas fa-check-circle" style="color: #28a745;"></i>
                                <div>
                                    <strong id="csv-file-name"></strong>
                                    <div style="font-size: 0.85rem; color: #666;">
                                        크기: <span id="csv-file-size"></span>
                                    </div>
                                </div>
                                <button type="button" id="csv-file-clear" class="btn btn-sm" style="margin-left: auto; padding: 4px 8px;">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="import-options">
                        <h4>가져오기 옵션</h4>
                        <div class="option-group">
                            <label style="display: flex; align-items: center; gap: 10px; margin: 10px 0;">
                                <input type="radio" name="aircraft-import-mode" value="replace" checked>
                                <span>
                                    <strong>모든 데이터 교체</strong>
                                    <div style="font-size: 0.85rem; color: #666; margin-top: 4px;">
                                        기존 기종 데이터를 모두 삭제하고 CSV 파일의 데이터로 교체합니다.
                                    </div>
                                </span>
                            </label>
                            <label style="display: flex; align-items: center; gap: 10px; margin: 10px 0;">
                                <input type="radio" name="aircraft-import-mode" value="merge">
                                <span>
                                    <strong>데이터 병합</strong>
                                    <div style="font-size: 0.85rem; color: #666; margin-top: 4px;">
                                        기존 기종 데이터는 유지하고 새로운 기종만 추가합니다. (중복 제외)
                                    </div>
                                </span>
                            </label>
                        </div>

                        <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #ddd;">
                            <label style="display: flex; align-items: flex-start; gap: 10px; margin: 10px 0;">
                                <input type="checkbox" id="aircraft-recalc-waypoints" style="margin-top: 4px;">
                                <span>
                                    <strong>웨이포인트 시간 재계산</strong>
                                    <div style="font-size: 0.85rem; color: #666; margin-top: 4px;">
                                        임포트된 항공기를 사용하는 기존 항공편의 웨이포인트 도착 시간을 새로운 최적화 로직으로 재계산합니다. (시간이 소요될 수 있습니다)
                                    </div>
                                </span>
                            </label>
                        </div>
                    </div>

                    <div id="csv-import-progress" style="display: none; margin-top: 20px;">
                        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                            <div class="spinner-small"></div>
                            <span id="csv-import-status-text">파일을 가져오는 중입니다...</span>
                        </div>
                        <div class="progress-bar">
                            <div id="csv-import-progress-fill" class="progress-fill" style="width: 0%;"></div>
                        </div>
                    </div>

                    <div id="csv-import-result" style="display: none; margin-top: 20px;">
                        <div id="csv-import-result-box" class="import-result-box"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" id="aircraft-import-cancel" class="btn btn-secondary">
                    <i class="fas fa-times"></i> 취소
                </button>
                <button type="button" id="aircraft-import-submit" class="btn btn-primary" disabled>
                    <i class="fas fa-upload"></i> 가져오기
                </button>
            </div>
        </div>
    </div>
</div>
